<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Fluid Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02040a; /* Fallback deep black */
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #ui {
            position: absolute;
            bottom: 50px;
            left: 50px;
            color: white;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        #time { font-size: 4rem; font-weight: 200; margin: 0; }
        #date { font-size: 1.2rem; opacity: 0.6; letter-spacing: 2px; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui">
        <h1 id="time">00:00</h1>
        <div id="date">CALIBRATING...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');

        let width, height, stars = [];
        let tick = 0;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.2 + 0.1
                });
            }
        }

        function drawNebula() {
            tick += 0.002;
            
            // Create a moving fluid gradient
            const grad = ctx.createRadialGradient(
                width/2 + Math.sin(tick) * (width/3), 
                height/2 + Math.cos(tick) * (height/3), 
                0, 
                width/2, height/2, width
            );
            
            // Space Colors
            grad.addColorStop(0, '#1e1b4b'); // Deep Indigo
            grad.addColorStop(0.4, '#312e81'); // Dark Blue
            grad.addColorStop(0.7, '#020617'); // Black
            grad.addColorStop(1, '#000000');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Add a secondary "gas" layer
            ctx.globalCompositeOperation = 'screen';
            const grad2 = ctx.createRadialGradient(
                width/2 + Math.cos(tick*0.5) * (width/2), 
                height/2 + Math.sin(tick*0.7) * (height/2), 
                0, 
                width/2, height/2, width/1.5
            );
            grad2.addColorStop(0, 'rgba(76, 29, 149, 0.2)'); // Purple haze
            grad2.addColorStop(1, 'transparent');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                
                s.y -= s.speed;
                if(s.y < 0) s.y = height;
            });
            ctx.globalAlpha = 1;
        }

        function loop() {
            drawNebula();
            drawStars();
            updateClock();
            requestAnimationFrame(loop);
        }

        function updateClock() {
            const now = new Date();
            timeEl.innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            dateEl.innerText = now.toLocaleDateString(undefined, {month: 'long', day: 'numeric'}).toUpperCase();
        }

        window.addEventListener('resize', init);
        init();
        loop();
    </script>
</body>
</html>
