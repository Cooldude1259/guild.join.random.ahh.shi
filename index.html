<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }

        /* Fixed background element with specific dimensions */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Floating player window in the top right corner */
        .wallpaper-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 450px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .wallpaper-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Click overlay to force browser media wake-up */
        .click-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="click-trigger" id="trigger">
        Click Anywhere to Initialize Video Player
    </div>

    <video class="bg-video" id="main-video" loop muted playsinline>
        <source src="crashed-spaceship-moewalls-com.mp4" type="video/mp4">
    </video>

    <div class="wallpaper-container">
        <iframe 
            src="https://www.youtube-nocookie.com/embed?listType=playlist&list=PLPt_iib-cZwTPDD1FtAJ_ZUpgbBmEglwd&autoplay=1&loop=1&playlist=PLPt_iib-cZwTPDD1FtAJ_ZUpgbBmEglwd&controls=0&modestbranding=1"
            title="Ambient Playlist Wallpaper"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const trigger = document.getElementById('trigger');
        const video = document.getElementById('main-video');

        trigger.addEventListener('click', () => {
            // Force the video element to compute size and play natively
            video.play().then(() => {
                // Smoothly clear the interaction blocker screen
                trigger.style.opacity = '0';
                setTimeout(() => trigger.remove(), 300);
            }).catch(err => {
                console.error("Playback failed: ", err);
            });
        });
    </script>

</body>
</html>
