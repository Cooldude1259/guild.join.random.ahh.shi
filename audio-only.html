<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }

        /* Full screen desktop background video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* Completely hidden container for the YouTube audio track */
        .audio-container {
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="crashed-spaceship-moewalls-com.mp4" type="video/mp4">
    </video>

    <div class="audio-container">
        <iframe 
            src="https://www.youtube-nocookie.com/embed?listType=playlist&list=PLPt_iib-cZwTPDD1FtAJ_ZUpgbBmEglwd&autoplay=1&loop=1&playlist=YOUR_PLAYLIST_ID_HERE&controls=0&modestbranding=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
    </div>

</body>
</html>
